# Test config. This file shadows src/main/resources/application.properties on the test
# classpath (they are not merged), so datasource settings are repeated here. CI overrides
# them with SPRING_DATASOURCE_* environment variables.
spring.application.name=ecommerce-api

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

app.cors.allowed-origins=http://localhost:3000

# >= 32-char HS256 secret so @WebMvcTest slices that import SecurityConfig can build the
# real JwtDecoder / JwtEncoder. SecurityEndToEndIT mints and validates in-process, so any
# value works; CI may override via JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:test-secret-test-secret-test-secret-0123456789}
app.security.jwt.expiration-seconds=3600
app.security.jwt.issuer=ecommerce-api-test
