spring.application.name=ecommerce-api

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Comma-separated list of storefront origins allowed to call /api/v1/**
app.cors.allowed-origins=http://localhost:3000

# --- JWT / security ---
# HS256 needs a >= 256-bit (>= 32 ASCII char) secret. Override JWT_SECRET in every real environment.
app.security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
app.security.jwt.expiration-seconds=3600
app.security.jwt.issuer=ecommerce-api
