spring.application.name=ecommerce-api

# --- Spring AI / Ollama ---
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.model.chat=ollama
spring.ai.ollama.chat.options.model=llama3.2

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Product picture uploads: per-file cap mirrors ProductPictureService.MAX_FILE_SIZE_BYTES;
# request cap allows a batch of several files in one POST.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Comma-separated list of storefront origins allowed to call /api/v1/**
app.cors.allowed-origins=http://localhost:3000

# --- JWT / security ---
# HS256 needs a >= 256-bit (>= 32 ASCII char) secret. Override JWT_SECRET in every real environment.
app.security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
app.security.jwt.expiration-seconds=3600
app.security.jwt.issuer=ecommerce-api
